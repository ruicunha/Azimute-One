name: Deploy chart-engine prototype to GitHub Pages

on:
  push:
    branches:
      - poc/chart-engine-noaa-enc
    paths:
      - 'prototypes/chart-engine/**'
      - '.github/workflows/deploy-chart-engine-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chart-engine-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: prototypes/chart-engine
        run: npm install

      - name: Download NOAA sample ENC
        run: |
          mkdir -p prototypes/chart-engine/public
          curl --fail --location --retry 3 \
            https://charts.noaa.gov/ENCs/US5MA12M.zip \
            --output prototypes/chart-engine/public/sample-chart.zip
          unzip -t prototypes/chart-engine/public/sample-chart.zip

      - name: Download detailed Boston Inner Harbor ENC
        run: |
          curl --fail --location --retry 3 \
            https://charts.noaa.gov/ENCs/US5MA11M.zip \
            --output prototypes/chart-engine/public/sample-chart-inner-harbor.zip
          unzip -t prototypes/chart-engine/public/sample-chart-inner-harbor.zip

      - name: Build site
        working-directory: prototypes/chart-engine
        run: npm run build -- --base=/Azimute-One/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: prototypes/chart-engine/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
